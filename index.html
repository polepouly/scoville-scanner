<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌶️ Scoville Scanner Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #c0392b;
      --primary-dark: #922B21;
      --secondary: #e67e22;
      --bg-dark: #1a1a1a;
      --bg-card: #2c2c2c;
      --text-light: #f5f0eb;
      --text-muted: #b0a89a;
      --shadow: 0 10px 30px rgba(0,0,0,0.5);
      --radius: 24px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      max-width: 500px;
      width: 100%;
      background: linear-gradient(145deg, #2d2d2d, #1f1f1f);
      border-radius: var(--radius);
      padding: 24px 20px 30px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 32px;
      background: linear-gradient(135deg, #e74c3c, #f39c12);
      padding: 8px;
      border-radius: 16px;
      line-height: 1;
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #e74c3c, #f39c12);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .logo small {
      font-size: 11px;
      color: var(--text-muted);
      -webkit-text-fill-color: var(--text-muted);
      display: block;
      font-weight: 400;
    }

    .badge-version {
      background: rgba(255,255,255,0.08);
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 11px;
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* Scanner */
    .scanner-box {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #0a0a0a;
      aspect-ratio: 4/3;
      margin-bottom: 16px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.06);
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #canvas {
      display: none;
    }

    .scan-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
      border: 2px solid rgba(231, 76, 60, 0.2);
      border-radius: 20px;
    }

    .scan-line {
      position: absolute;
      top: 20%;
      left: 10%;
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e74c3c, #f39c12, #e74c3c, transparent);
      filter: drop-shadow(0 0 12px #e74c3c);
      opacity: 0.7;
      animation: scanMove 4s ease-in-out infinite;
      border-radius: 100%;
    }

    @keyframes scanMove {
      0% { top: 15%; opacity: 0.3; }
      50% { top: 80%; opacity: 1; }
      100% { top: 15%; opacity: 0.3; }
    }

    .scan-corner {
      position: absolute;
      width: 25px;
      height: 25px;
      border: 3px solid rgba(231, 76, 60, 0.6);
      filter: drop-shadow(0 0 8px #e74c3c);
    }
    .scan-corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
    .scan-corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
    .scan-corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
    .scan-corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      flex: 1;
      padding: 14px 16px;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white;
      box-shadow: 0 4px 20px rgba(231, 76, 60, 0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 30px rgba(231, 76, 60, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text-light);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.14);
    }

    .btn-success {
      background: linear-gradient(135deg, #27ae60, #229954);
      color: white;
      box-shadow: 0 4px 20px rgba(39, 174, 96, 0.25);
    }

    /* Input group */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: var(--text-light);
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .input-group input:focus {
      border-color: #e74c3c;
      box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.15);
    }
    .input-group input::placeholder {
      color: var(--text-muted);
    }

    .btn-small {
      padding: 12px 20px;
      font-size: 13px;
      flex: 0 0 auto;
    }

    /* Result */
    .result-card {
      background: rgba(255,255,255,0.04);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.3s ease;
    }

    .result-card.active {
      border-color: rgba(231, 76, 60, 0.2);
      background: rgba(231, 76, 60, 0.04);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sauce-name {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .scoville-badge {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      padding: 6px 18px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 16px;
      color: white;
      box-shadow: 0 2px 15px rgba(231, 76, 60, 0.3);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .detail-item {
      background: rgba(255,255,255,0.04);
      padding: 10px 14px;
      border-radius: 14px;
    }

    .detail-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .detail-item .value {
      font-size: 15px;
      font-weight: 700;
      margin-top: 2px;
      color: #fff;
    }

    .detail-item.full {
      grid-column: 1 / -1;
    }

    .heat-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .heat-bar {
      flex: 1;
      height: 6px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .heat-bar-fill {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, #27ae60, #f1c40f, #e67e22, #e74c3c, #8e44ad);
      transition: width 0.8s ease;
      width: 0%;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .tag {
      background: rgba(255,255,255,0.06);
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 12px;
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .tag.highlight {
      background: rgba(231, 76, 60, 0.15);
      color: #e74c3c;
      border-color: rgba(231, 76, 60, 0.2);
    }

    .empty-state {
      color: var(--text-muted);
      text-align: center;
      padding: 12px 0;
      font-size: 14px;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 16px;
      letter-spacing: 0.3px;
    }

    @media (max-width: 420px) {
      .app-container { padding: 16px; }
      .logo h1 { font-size: 18px; }
      .detail-grid { grid-template-columns: 1fr; }
      .btn { font-size: 12px; padding: 12px; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <span class="logo-icon">🌶️</span>
      <div>
        <h1>Scoville Pro</h1>
        <small>Étiquette Scanner</small>
      </div>
    </div>
    <span class="badge-version">v2.0</span>
  </div>

  <!-- Scanner -->
  <div class="scanner-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-overlay"></div>
    <div class="scan-line"></div>
    <div class="scan-corner tl"></div>
    <div class="scan-corner tr"></div>
    <div class="scan-corner bl"></div>
    <div class="scan-corner br"></div>
  </div>

  <!-- Input -->
  <div class="input-group">
    <input type="text" id="ingredientInput" placeholder="Liste des ingrédients..." value="piment habanero, ail, vinaigre, sucre">
    <button class="btn btn-small btn-success" id="manualBtn">Analyser</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="scanBtn">📸 Scanner</button>
    <button class="btn btn-secondary" id="resetBtn">↺ Effacer</button>
  </div>

  <!-- Result -->
  <div class="result-card" id="resultCard">
    <div class="empty-state" id="emptyState">🔍 Scannez une étiquette ou saisissez des ingrédients</div>

    <div id="resultContent" style="display: none;">
      <div class="result-header">
        <span class="sauce-name" id="sauceName">Sauce</span>
        <span class="scoville-badge" id="scovilleDisplay">0 SHU</span>
      </div>

      <div class="detail-grid">
        <div class="detail-item">
          <div class="label">🌶️ Capsaïcine</div>
          <div class="value" id="capsaicinEst">0 mg/g</div>
        </div>
        <div class="detail-item">
          <div class="label">📊 Niveau</div>
          <div class="value" id="heatLevel">Doux</div>
        </div>
        <div class="detail-item full">
          <div class="label">🧪 Ingrédients détectés</div>
          <div class="value" id="ingredientList">—</div>
        </div>
      </div>

      <div class="heat-indicator">
        <span style="font-size:13px; color:var(--text-muted)">Piquant</span>
        <div class="heat-bar">
          <div class="heat-bar-fill" id="heatBar"></div>
        </div>
      </div>

      <div class="tag-container" id="tagContainer"></div>
    </div>
  </div>

  <div class="footer">
    🚀 Projet GitHub Pages · Basé sur la liste des ingrédients
  </div>
</div>

<script>
  (function() {
    // DOM elements
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scanBtn = document.getElementById('scanBtn');
    const resetBtn = document.getElementById('resetBtn');
    const manualBtn = document.getElementById('manualBtn');
    const ingredientInput = document.getElementById('ingredientInput');

    const resultCard = document.getElementById('resultCard');
    const emptyState = document.getElementById('emptyState');
    const resultContent = document.getElementById('resultContent');
    const sauceName = document.getElementById('sauceName');
    const scovilleDisplay = document.getElementById('scovilleDisplay');
    const capsaicinEst = document.getElementById('capsaicinEst');
    const heatLevel = document.getElementById('heatLevel');
    const ingredientList = document.getElementById('ingredientList');
    const heatBar = document.getElementById('heatBar');
    const tagContainer = document.getElementById('tagContainer');

    let stream = null;
    let scanInProgress = false;

    // ---------- CAMERA ----------
    async function startCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
        }
        const constraints = {
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        return true;
      } catch (err) {
        alert('📷 Accès caméra requis. Autorisez dans les paramètres.');
        console.error(err);
        return false;
      }
    }

    // ---------- INGREDIENT DATABASE ----------
    const scovilleDB = {
      'habanero': 350000,
      'piment habanero': 350000,
      'piment': 80000,
      'cayenne': 45000,
      'jalapeño': 6000,
      'jalapeno': 6000,
      'scotch bonnet': 250000,
      'ghost': 1000000,
      'bhut jolokia': 1000000,
      'dorset naga': 1200000,
      'trinidad scorpion': 1500000,
      'reaper': 2200000,
      'carolina reaper': 2200000,
      'chipotle': 9000,
      'piment doux': 100,
      'poivron': 0,
      'tomate': 0,
      'ail': 200,
      'oignon': 100,
      'vinaigre': 50,
      'citron': 30,
      'sucre': 0,
      'sel': 0,
      'épices': 500,
      'poivre': 1500,
      'gingembre': 200,
      'curcuma': 100,
      'coriandre': 50,
      'cumin': 100,
      'origan': 30,
      'basilic': 10,
      'piment rouge': 80000,
      'piment vert': 5000,
      'chili': 80000,
      'pepper': 80000,
      'piri piri': 150000,
      'piri-piri': 150000,
      'piment oiseau': 100000,
      'thai': 100000,
      'thaï': 100000,
      'serrano': 25000,
      'anaheim': 500,
      'pasilla': 1000,
      'guajillo': 2500,
      'arbol': 15000,
      'cascabel': 1500,
      'mexican': 2000
    };

    // ---------- ANALYZE ----------
    function analyzeIngredients(raw) {
      const normalized = raw.toLowerCase()
        .replace(/[.,;:!?()]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      // Split by common separators
      let items = normalized.split(/[,;•·+&]|\s+et\s+|\s*,\s*/).map(s => s.trim()).filter(s => s.length > 0);
      if (items.length === 0) {
        items = normalized.split(/\s+/).filter(s => s.length > 0);
      }

      let totalSHU = 0;
      const detected = [];

      items.forEach(item => {
        let matched = false;
        // Try exact match first
        const exactKey = Object.keys(scovilleDB).find(k => item === k);
        if (exactKey) {
          totalSHU += scovilleDB[exactKey];
          detected.push(item);
          matched = true;
        } else {
          // Partial match
          for (const [key, value] of Object.entries(scovilleDB)) {
            if (item.includes(key) || key.includes(item)) {
              totalSHU += value;
              detected.push(item);
              matched = true;
              break;
            }
          }
        }
        if (!matched && item.length > 2) {
          detected.push(item);
          if (item.includes('piment') || item.includes('chili') || item.includes('pepper') || item.includes('piri')) {
            totalSHU += 50000;
          }
        }
      });

      if (detected.length === 0) {
        detected.push('ingrédients non reconnus');
        totalSHU = 100;
      }

      totalSHU = Math.min(Math.round(totalSHU), 3200000);

      const capsaicin = (totalSHU * 0.000015);
      const capsaicinDisplay = capsaicin.toFixed(3);

      let heatText, heatPercent;
      if (totalSHU < 500) { heatText = '🌿 Doux'; heatPercent = 5; }
      else if (totalSHU < 2500) { heatText = '🌶️ Léger'; heatPercent = 15; }
      else if (totalSHU < 8000) { heatText = '🌶️ Modéré'; heatPercent = 30; }
      else if (totalSHU < 25000) { heatText = '🔥 Piquant'; heatPercent = 50; }
      else if (totalSHU < 80000) { heatText = '🔥🔥 Fort'; heatPercent = 70; }
      else if (totalSHU < 300000) { heatText = '💀 Très fort'; heatPercent = 88; }
      else { heatText = '☠️ LÉGENDAIRE'; heatPercent = 100; }

      const names = ['Sauce Fuego', 'El Diablo', 'Mayan Heat', 'Dragon Fire', 'Volcano', 'Ghost Rider', 'Scorpion Strike', 'Habanero Blaze', 'Smoky Chipotle', 'Piri Piri Fusion', 'Carolina Reaper', 'Thai Spice'];
      const name = names[Math.floor(Math.random() * names.length)];

      return { name, shu: totalSHU, capsaicin: capsaicinDisplay, ingredients: detected, heatText, heatPercent };
    }

    // ---------- DISPLAY ----------
    function displayResult(result) {
      emptyState.style.display = 'none';
      resultContent.style.display = 'block';
      resultCard.classList.add('active');

      sauceName.textContent = result.name;
      scovilleDisplay.textContent = result.shu.toLocaleString() + ' SHU';
      capsaicinEst.textContent = result.capsaicin + ' mg/g';
      heatLevel.textContent = result.heatText;
      ingredientList.textContent = result.ingredients.join(', ');
      heatBar.style.width = result.heatPercent + '%';

      // Tags
      tagContainer.innerHTML = '';
      const tags = ['🌶️ Piment', '🧄 Ail', '🍋 Citron', '🌿 Herbes', '🥫 Vinaigre', '🧂 Sel', '🍯 Sucre', '🔥 Habanero'];
      const shuffled = tags.sort(() => Math.random() - 0.5);
      const selected = shuffled.slice(0, 4);
      selected.forEach(t => {
        const span = document.createElement('span');
        span.className = 'tag' + (t.includes('Habanero') ? ' highlight' : '');
        span.textContent = t;
        tagContainer.appendChild(span);
      });
    }

    function resetDisplay() {
      emptyState.style.display = 'block';
      resultContent.style.display = 'none';
      resultCard.classList.remove('active');
      heatBar.style.width = '0%';
      tagContainer.innerHTML = '';
    }

    // ---------- CAMERA SCAN ----------
    function simulateOCRExtraction() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let red = 0, green = 0, yellow = 0, brown = 0;
      const step = 16;
      for (let i = 0; i < data.length; i += step * 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        if (r < 30 && g < 30 && b < 30) continue;
        if (r > 230 && g > 230 && b > 230) continue;
        if (r > 150 && g < 120 && b < 100) red += 1.5;
        else if (r > 170 && g > 100 && b < 90) yellow += 1.2;
        else if (g > 120 && r < 150 && b < 120) green += 1.0;
        else if (r < 110 && g < 90 && b < 70) brown += 0.8;
      }

      const detected = [];
      if (red > 6) detected.push('piment rouge');
      if (yellow > 5) detected.push('piment doux');
      if (green > 4) detected.push('piment vert');
      if (brown > 3) detected.push('chipotle');
      if (detected.length === 0) detected.push('tomate', 'épices');
      if (Math.random() > 0.4) detected.push('ail');
      if (Math.random() > 0.5) detected.push('vinaigre');
      return detected;
    }

    async function performScan() {
      if (scanInProgress) return;
      scanInProgress = true;
      scanBtn.disabled = true;
      scanBtn.textContent = '⏳ Scan...';

      try {
        if (!stream || !video.videoWidth) {
          const ok = await startCamera();
          if (!ok) { scanBtn.disabled = false; scanBtn.textContent = '📸 Scanner'; scanInProgress = false; return; }
          await new Promise(r => setTimeout(r, 300));
        }

        const detected = simulateOCRExtraction();
        const inputStr = detected.join(', ');
        ingredientInput.value = inputStr;
        const result = analyzeIngredients(inputStr);
        displayResult(result);
      } catch (e) {
        console.error(e);
        alert('Erreur de scan. Réessayez.');
      } finally {
        scanInProgress = false;
        scanBtn.disabled = false;
        scanBtn.textContent = '📸 Scanner';
      }
    }

    // ---------- MANUAL ----------
    function manualAnalyze() {
      const raw = ingredientInput.value.trim();
      if (!raw) {
        alert('Veuillez saisir des ingrédients.');
        return;
      }
      const result = analyzeIngredients(raw);
      displayResult(result);
    }

    // ---------- EVENTS ----------
    scanBtn.addEventListener('click', performScan);
    manualBtn.addEventListener('click', manualAnalyze);
    ingredientInput.addEventListener('keydown', e => { if (e.key === 'Enter') manualAnalyze(); });

    resetBtn.addEventListener('click', () => {
      resetDisplay();
      ingredientInput.value = '';
      if (!stream) startCamera();
    });

    // ---------- INIT ----------
    (async function init() {
      await startCamera();
      resetDisplay();
      ingredientInput.value = 'piment habanero, ail, vinaigre, sucre, sel';
      // Auto-analyze with default
      const result = analyzeIngredients(ingredientInput.value);
      displayResult(result);
    })();

    window.addEventListener('beforeunload', () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
    });

  })();
</script>
</body>
</html>

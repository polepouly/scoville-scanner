<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌶️ Scoville Scanner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #1a1e1c;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      margin: 0;
    }
    .app-card {
      max-width: 480px;
      width: 100%;
      background: #fcf7f0;
      border-radius: 48px 48px 32px 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255, 200, 100, 0.2);
      overflow: hidden;
      padding: 24px 20px 32px;
      transition: all 0.2s;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b22222;
      letter-spacing: -0.5px;
      padding-bottom: 8px;
      border-bottom: 3px dashed #e0c9b0;
    }
    h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #6b4e3a;
      margin-left: auto;
      background: #ede3d7;
      padding: 4px 14px;
      border-radius: 40px;
    }
    .scanner-box {
      position: relative;
      margin: 20px 0 16px;
      background: #2d2a26;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0d0b09;
    }
    #canvas {
      display: none;
    }
    .scan-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,0.4) 80%);
      border: 2px solid rgba(255, 220, 150, 0.3);
      border-radius: 36px;
      box-shadow: inset 0 0 40px rgba(255, 100, 0, 0.2);
    }
    .scan-line {
      position: absolute;
      top: 20%;
      left: 10%;
      width: 80%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff9f4b, #ff3c00, #ff9f4b, transparent);
      filter: drop-shadow(0 0 10px #ff6a00);
      opacity: 0.8;
      animation: scanMove 3.5s ease-in-out infinite;
      border-radius: 100%;
    }
    @keyframes scanMove {
      0% { top: 15%; opacity: 0.4; }
      50% { top: 80%; opacity: 1; }
      100% { top: 15%; opacity: 0.4; }
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .btn {
      background: #2b2b28;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 14px 24px;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 0 #0f0f0e, 0 4px 12px rgba(0,0,0,0.3);
      transition: all 0.08s linear;
      cursor: pointer;
      flex: 1 1 auto;
      justify-content: center;
    }
    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #0f0f0e;
    }
    .btn-primary {
      background: #d94f2a;
      box-shadow: 0 6px 0 #7e2b14;
    }
    .btn-primary:active {
      background: #b83d1d;
    }
    .btn-secondary {
      background: #4d4a45;
      box-shadow: 0 6px 0 #2b2925;
    }
    .btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0f0f0e;
      pointer-events: none;
    }
    .result-card {
      margin: 24px 0 12px;
      padding: 20px 18px;
      background: #e8ddd0;
      border-radius: 32px;
      box-shadow: inset 0 2px 8px rgba(90, 50, 20, 0.2);
      transition: 0.2s;
    }
    .result-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .sauce-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2d1f12;
      letter-spacing: -0.3px;
    }
    .scoville-badge {
      background: #b22222;
      color: white;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 1.2rem;
      box-shadow: 0 2px 0 #5f1313;
    }
    .detail-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #bba793;
      padding: 6px 0;
      font-size: 0.95rem;
    }
    .detail-label {
      color: #3f2e1e;
      font-weight: 500;
    }
    .detail-value {
      font-weight: 600;
      color: #1f130b;
    }
    .ingredient-tag {
      display: inline-block;
      background: #cbad8a;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1e140e;
      margin: 4px 4px 0 0;
    }
    .footnote {
      font-size: 0.8rem;
      text-align: center;
      color: #7b6856;
      margin-top: 16px;
      border-top: 1px solid #d6c6b6;
      padding-top: 14px;
    }
    .status-badge {
      background: #4d4a45;
      color: #f0e3d6;
      border-radius: 40px;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-block;
    }
    .flex-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    @media (max-width: 450px) {
      .app-card { padding: 16px; }
      .btn { font-size: 0.9rem; padding: 12px 16px; }
    }
  </style>
</head>
<body>
<div class="app-card">
  <h1>
    🌶️ Scoville
    <small>scan</small>
  </h1>

  <!-- Caméra / scanner -->
  <div class="scanner-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-overlay"></div>
    <div class="scan-line"></div>
  </div>

  <!-- Boutons -->
  <div class="controls">
    <button class="btn btn-primary" id="scanBtn">📸 Scanner</button>
    <button class="btn btn-secondary" id="resetBtn">⟲ Réinitialiser</button>
  </div>

  <!-- Résultat -->
  <div class="result-card" id="resultPanel">
    <div class="result-header">
      <span class="sauce-name" id="sauceName">🔍 En attente</span>
      <span class="scoville-badge" id="scovilleDisplay">---</span>
    </div>
    <div class="detail-list" id="detailList">
      <div class="detail-row">
        <span class="detail-label">🌶️ Capsaïcine estimée</span>
        <span class="detail-value" id="capsaicinEst">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">🧪 Ingrédients détectés</span>
        <span class="detail-value" id="ingredientList">Aucun</span>
      </div>
      <div class="detail-row" style="border-bottom: none;">
        <span class="detail-label">📊 Niveau</span>
        <span class="detail-value" id="heatLevel">—</span>
      </div>
    </div>
    <!-- Tags ingrédients supplémentaires -->
    <div id="tagContainer" style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px;"></div>
  </div>
  <div class="footnote">
    ⚡ basé sur la composition visuelle · estimation Scoville
  </div>
</div>
<script>
  (function() {
    // ---------- ÉLÉMENTS DOM ----------
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scanBtn = document.getElementById('scanBtn');
    const resetBtn = document.getElementById('resetBtn');

    const sauceNameEl = document.getElementById('sauceName');
    const scovilleDisplay = document.getElementById('scovilleDisplay');
    const capsaicinEst = document.getElementById('capsaicinEst');
    const ingredientList = document.getElementById('ingredientList');
    const heatLevel = document.getElementById('heatLevel');
    const tagContainer = document.getElementById('tagContainer');

    // ---------- ÉTAT ----------
    let stream = null;
    let scanInProgress = false;

    // ---------- INIT CAMÉRA ----------
    async function startCamera() {
      try {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        const constraints = {
          video: {
            facingMode: 'environment',
            width: { ideal: 640 },
            height: { ideal: 640 }
          },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        // définir canvas à la taille de la vidéo
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 640;
        return true;
      } catch (err) {
        alert('Impossible d\'accéder à la caméra. Veuillez autoriser ou utiliser un smartphone.');
        console.error(err);
        return false;
      }
    }

    // ---------- ANALYSE D'IMAGE ----------
    function analyzeImage() {
      // Dessiner l'image actuelle de la vidéo dans le canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      // 1. Extraire les couleurs dominantes (échantillonnage)
      const colorCount = {};
      const step = 12; // échantillonnage pour performance
      for (let i = 0; i < data.length; i += step * 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        // ignorer les noirs / blancs trop neutres
        if (r < 30 && g < 30 && b < 30) continue;
        if (r > 230 && g > 230 && b > 230) continue;
        const key = `${Math.round(r/16)*16},${Math.round(g/16)*16},${Math.round(b/16)*16}`;
        colorCount[key] = (colorCount[key] || 0) + 1;
      }

      // Trier les couleurs par fréquence
      const sortedColors = Object.entries(colorCount).sort((a,b) => b[1] - a[1]);
      const topColors = sortedColors.slice(0, 6).map(entry => entry[0].split(',').map(Number));

      // 2. Détection d'ingrédients / indices visuels
      // Mapping couleurs -> ingrédients / estimation Scoville
      let detectedIngredients = [];
      let scovilleScore = 0;
      let capsaicinMg = 0;

      // On simule une détection basée sur les couleurs dominantes
      // (dans la vraie vie, on utiliserait un modèle ML, mais ici on fait une heuristique "sauce piquante")
      // On va analyser les teintes rouges/orangées/vertes
      let redIntensity = 0;
      let greenIntensity = 0;
      let yellowOrange = 0;
      let brownDark = 0;

      topColors.forEach(([r, g, b]) => {
        // rouge vif : piment rouge / habanero / cayenne
        if (r > 150 && g < 120 && b < 100) redIntensity += (r / 255) * 2;
        // orange / jaune : piment doux / scotch bonnet
        if (r > 180 && g > 100 && b < 80) yellowOrange += 1.2;
        // vert : piment vert / jalapeño
        if (g > 130 && r < 140 && b < 120) greenIntensity += 1.0;
        // brun / foncé : sauce fermentée / chipotle
        if (r < 100 && g < 80 && b < 60) brownDark += 0.8;
      });

      // Décision sur les ingrédients (simulé)
      if (redIntensity > 2.0) {
        detectedIngredients.push('Piment rouge (Cayenne/Habanero)');
        scovilleScore += 180000;
        capsaicinMg += 2.5;
      }
      if (yellowOrange > 1.5) {
        detectedIngredients.push('Piment doux / Scotch bonnet');
        scovilleScore += 120000;
        capsaicinMg += 1.8;
      }
      if (greenIntensity > 1.0) {
        detectedIngredients.push('Piment vert (Jalapeño)');
        scovilleScore += 6000;
        capsaicinMg += 0.6;
      }
      if (brownDark > 0.8) {
        detectedIngredients.push('Chipotle / sauce fermentée');
        scovilleScore += 9000;
        capsaicinMg += 0.9;
      }

      // Si aucun ingrédient fort détecté, on met un défaut "tomate / épices"
      if (detectedIngredients.length === 0) {
        detectedIngredients.push('Base tomate / épices douces');
        scovilleScore = 300;
        capsaicinMg = 0.05;
      }

      // Ajouter un peu de random pour la "variété" mais garder cohérent
      // On ajuste avec une petite variation pour rendre l'app vivante
      const variation = (Math.random() * 0.3 + 0.85);
      scovilleScore = Math.floor(scovilleScore * variation);
      if (scovilleScore < 100) scovilleScore = 100; // mini

      // Niveau de chaleur (texte)
      let heatText = '';
      if (scovilleScore < 1000) heatText = '🌿 Doux';
      else if (scovilleScore < 5000) heatText = '🌶️ Modéré';
      else if (scovilleScore < 25000) heatText = '🔥 Piquant';
      else if (scovilleScore < 80000) heatText = '🔥🔥 Très piquant';
      else if (scovilleScore < 300000) heatText = '💀 Extrême';
      else heatText = '☠️ LÉGENDaire';

      // Nom de sauce "généré"
      const sauceNames = ['Sauce Fuego', 'El Diablo', 'Mayan Heat', 'Dragon\'s Breath', 'Volcano Sauce', 'Piri-Piri Fusion', 'Ghost Pepper Blend', 'Smoky Chipotle'];
      const nameIndex = Math.floor(Math.random() * sauceNames.length);
      const sauceName = sauceNames[nameIndex];

      // Mise à jour UI
      sauceNameEl.textContent = sauceName;
      scovilleDisplay.textContent = `${scovilleScore.toLocaleString()} SHU`;
      capsaicinEst.textContent = `${capsaicinMg.toFixed(2)} mg/g`;
      ingredientList.textContent = detectedIngredients.join(', ') || 'Indéterminé';
      heatLevel.textContent = heatText;

      // Tags supplémentaires (ingrédients)
      tagContainer.innerHTML = '';
      const extraTags = ['🌶️ Piment', '🧄 Ail', '🍋 Citron', '🌿 Herbes', '🥫 Vinaigre'];
      const shuffled = extraTags.sort(() => 0.5 - Math.random());
      const selectedTags = shuffled.slice(0, 3);
      selectedTags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'ingredient-tag';
        span.textContent = tag;
        tagContainer.appendChild(span);
      });

      // Ajouter un tag "Bio" ou "Artisanal" aléatoire
      const extraSpan = document.createElement('span');
      extraSpan.className = 'ingredient-tag';
      extraSpan.textContent = Math.random() > 0.5 ? '🏷️ Artisanal' : '🌱 Naturel';
      tagContainer.appendChild(extraSpan);
    }

    // ---------- SCAN ----------
    async function performScan() {
      if (scanInProgress) return;
      scanInProgress = true;
      scanBtn.disabled = true;
      scanBtn.textContent = '⏳ Analyse...';

      try {
        // S'assurer que la caméra est active
        if (!stream || !video.videoWidth) {
          const ok = await startCamera();
          if (!ok) {
            scanBtn.disabled = false;
            scanBtn.textContent = '📸 Scanner';
            scanInProgress = false;
            return;
          }
          // patienter un peu pour que la caméra soit prête
          await new Promise(r => setTimeout(r, 400));
        }
        // Capturer et analyser
        analyzeImage();
      } catch (e) {
        console.error(e);
        alert('Erreur lors du scan. Réessayez.');
      } finally {
        scanInProgress = false;
        scanBtn.disabled = false;
        scanBtn.textContent = '📸 Scanner';
      }
    }

    // ---------- RÉINITIALISATION ----------
    function resetApp() {
      sauceNameEl.textContent = '🔍 En attente';
      scovilleDisplay.textContent = '---';
      capsaicinEst.textContent = '—';
      ingredientList.textContent = 'Aucun';
      heatLevel.textContent = '—';
      tagContainer.innerHTML = '';
    }

    // ---------- ÉVÉNEMENTS ----------
    scanBtn.addEventListener('click', performScan);

    resetBtn.addEventListener('click', function() {
      resetApp();
      // Option : relancer la caméra pour un nouveau scan
      if (!stream) {
        startCamera();
      }
    });

    // ---------- DÉMARRAGE AUTO ----------
    (async function init() {
      await startCamera();
      // afficher un message par défaut
      resetApp();
    })();

    // Gérer le nettoyage
    window.addEventListener('beforeunload', function() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });

  })();
</script>
</body>
</html>
